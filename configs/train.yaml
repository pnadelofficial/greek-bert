# =============================================================================
# GreekBERT pretraining -- RoBERTa-style MLM
# Based on: https://arxiv.org/abs/1907.11692
#
# Relative paths here resolve against THIS FILE's directory, so this config
# works from any cwd. Per-run paths are injected by slurm/env.sh via
# CHECKPOINT_DIR / TENSORBOARD_DIR / HF_EXPORT_DIR and win over the values below.
# =============================================================================

# --- Learning rate schedule --------------------------------------------------
# RoBERTa's 6e-4 was tuned for an 8k-sequence batch on a FROM-SCRATCH model.
# This run CONTINUES a converged aristoBERTo at effective batch 128, where 6e-4
# is far too hot (audit item 4); the epoch-20 curve was still descending
# monotonically, consistent with an LR that overshoots. 2e-4 is the upper end
# of the audit's recommended 1e-4-2e-4 band for continued pretraining.
# OneCycleLR uses max_lr as the peak and ignores `lr` entirely, so both are set
# to the same value on purpose (train.py prints the scheduler's real LR to
# verify this).
lr: 2e-4            # base LR (equals max_lr; see above)
max_lr: 2e-4        # peak LR after warmup
pct_start: 0.05     # 5% of total steps spent warming up

# --- MLM masking -------------------------------------------------------------
# RoBERTa: 15% (dynamic). ModernBERT: 30%. We use 30% with dynamic masking
# for more learning signal per step.
mask_prob: 0.30

# --- Batch size and training length -----------------------------------------
# Effective batch = batch_size * world_size * gradient_accumulation_steps
# = 16 x 8 x 1 = 128 sequences (65k tokens) by default.
# A BERT-base MLM at 512 tokens fits 128-256 per H200 with bf16 (audit Tier 3),
# so raise batch_size to ~128 for ~8x throughput; with an 8x larger batch keep
# LR at ~2e-4 (or raise toward 4e-4) rather than 6e-4.
batch_size: 16                    # per-GPU
# Budget to train PAST the epoch-20 plateau the previous run hit: at batch 16
# this is ~215k optimizer steps (~14B tokens). Lower if you raise batch_size.
num_epochs: 40
gradient_accumulation_steps: 1

# --- Optimizer ---------------------------------------------------------------
# AdamW; beta2=0.98 (not the 0.999 default) for stability at large batch.
# Set in scripts/train.py.
weight_decay: 0.01

# --- Training behaviour ------------------------------------------------------
# AMP: bf16 by default (no GradScaler); the bf16 knob lives in TrainingConfig.
use_mixed_precision: true

# --- Model and data ----------------------------------------------------------
pretrained_model: "nlpaueb/bert-base-greek-uncased-v1"
tokenized_dataset_path: "../data/nlpaueb_tokenized_open_greek_dataset"

# --- Logging, checkpoints, export -------------------------------------------
# Defaults for running by hand (paths are relative to THIS file).
# Under SLURM these are overridden per RUN_NAME to
# runs/<RUN_NAME>/{checkpoints,tensorboard,hf_format} by slurm/env.sh.
log_interval: 100
checkpoint_dir: "../scripts/checkpoints"
tensorboard_dir: "../scripts/runs"
output_dir: "../models/ManualExport"
