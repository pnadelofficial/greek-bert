# =============================================================================
# GreekBERT pretraining — model 4 of the 4-model comparison (docs/EXPERIMENTS-2X2.md)
#
#   Fresh ModernBERT (random init) + 50k cased Greek BPE
#   (tokenizers/modernbert-greek-tokenizer-v2)
#
# mask_prob 0.30 (dynamic 80/10/10 + special-token guard), lr 2e-4,
# AdamW betas (0.9, 0.98), bf16, best-checkpoint by all-reduced val loss.
# Converged cleanly from random init at this LR -- no instability, unlike
# BERT-base from random init (see docs/EXPERIMENTS-2X2.md's LR postmortem).
#
# This file is pretrained_model: null only -- it is model 4's config, not a
# warm-start config. The "warm-start from a ModernBERT checkpoint" design
# that used to live here (the original arm 3) was retired; the live
# ModernBERT-warm-start work is now "model 5" (the two-stage comparison with
# real aristoBERTo's own training history), which lives in a SEPARATE file:
# configs/train-modernbert-fast.yaml.
#
# Launch (submit from the project root):
#   RUN_NAME=arm4-modernbert-scratch \
#     TOKENIZED_DATASET_PATH=data/greekbpe_tokenized_open_greek_dataset_v2 \
#     CONFIG_PATH=configs/train-modernbert.yaml sbatch slurm/pretrain.sh
#
# NOTE: needs the Greek-BPE tokenized corpus (different vocab from models
# 1-3), built with:  python scripts/prepare_data.py \
#                 --tokenizer tokenizers/modernbert-greek-tokenizer-v2 \
#                 --out data/greekbpe_tokenized_open_greek_dataset_v2
# =============================================================================

lr: 2e-4
max_lr: 2e-4
pct_start: 0.05
mask_prob: 0.30

# Same batch/epoch budget as arm 1 for comparability. ModernBERT-base is
# ~2.5x BERT-base (22 layers, 768 hidden, gated MLP), so wall-clock per epoch
# is higher; num_epochs is the same TOKEN budget in epoch terms but ~2.5x the
# compute. Lower num_epochs if you raise batch_size.
batch_size: 16
num_epochs: 40
gradient_accumulation_steps: 1

weight_decay: 0.01
use_mixed_precision: true   # bf16 (TrainingConfig.bf16 default)

# --- Arm selection -----------------------------------------------------------
# Arm 4 (from scratch): leave pretrained_model null and set model_config +
# tokenizer explicitly.
# Arm 3 (warm start): set pretrained_model to an exported ModernBERT-Greek
# checkpoint; model_config/tokenizer are then read from that checkpoint.
pretrained_model: null
model_config: "answerdotai/ModernBERT-base"
# v2 = the CLEAN retrain from scripts/train_bpe.py. Do NOT use the v1
# (tokenizers/modernbert-greek-tokenizer) — it is corrupted (mojibake vocab,
# see docs/EXPERIMENTS-2X2.md). If you have not yet run train_bpe.py, run it
# first; this path will not exist until then.
tokenizer: "tokenizers/modernbert-greek-tokenizer-v2"

# Greek-BPE tokenized corpus (50k vocab). NOT the nlpaueb/WordPiece one.
# Built by: python scripts/prepare_data.py \
#     --tokenizer tokenizers/modernbert-greek-tokenizer-v2 \
#     --out data/greekbpe_tokenized_open_greek_dataset_v2
tokenized_dataset_path: "../data/greekbpe_tokenized_open_greek_dataset_v2"

log_interval: 100
checkpoint_dir: "../scripts/checkpoints"
tensorboard_dir: "../scripts/runs"
output_dir: "../models/ManualExport"
