[project]
name = "spacy-code"
version = "0.1.0"
description = "Ancient Greek spaCy pipeline (parser, morphologizer, lemmatizer) fine-tuned from GreekBERT. Separate uv project: pinned to Python 3.12 + cupy<14."
dependencies = [
    "cupy-cuda12x>=13.4,<14",
    "spacy>=3.8.16",
    "spacy-transformers>=1.4.0",
    "thinc[torch]>=8.3.13",
    "torch>=2.7",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]