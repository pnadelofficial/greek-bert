[project]
name = "greek-bert"
version = "0.1.0"
description = "Ancient Greek BERT: MLM pretraining, WSD, and SBERT (root project; spaCy work lives in spacy_code/)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "cupy-cuda12x[ctk]>=14.2.0",
    "datasets>=5.0.1",
    "jupyter>=1.1.1",
    "numpy>=1.26",
    "pandas>=3.0.5",
    "pyyaml>=6.0",
    "sentence-transformers>=3.0",
    "spacy>=3.8.16",
    "spacy-curated-transformers>=0.3.1",
    "tensorboard>=2.16",
    "tokenizers>=0.23.2",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "tqdm>=4.70.1",
    "transformers>=5.17.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
